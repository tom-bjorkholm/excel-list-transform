[pytest]
addopts = --maxfail=20
markers =
  smoke
  slow
# Deprecation warnings from config_as_json are errors, so that use of a
# deprecated config_as_json API fails the tests instead of going unnoticed.
filterwarnings =
  error:.*\(\) does not accept the (member_name|ok_to_use_defaults) keyword:DeprecationWarning
  error:(Config|ReadOldConfiguration)\.\w+\(\) is deprecated:DeprecationWarning
