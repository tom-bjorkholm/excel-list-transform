name: CI Windows

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: "pip"

      - name: Build tools sync
        run: Set-Location common_build_tools && git checkout master && git pull

      - name: Run clean build
        run: python -m pip install --upgrade gitpython && python .\run_clean_build.py


      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports_index.html
          path: reports/index.html
          archive: false

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/

      - name: Upload doc
        uses: actions/upload-artifact@v7
        with:
          name: doc
          path: doc/

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/


  cleanup-runs:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: Keep last 1 success, keep newer failures
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_ID: main_win.yml
          KEEP_SUCCESS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          # --jq flattens all pages into one run object per line.
          $runs = @(gh api --paginate "repos/$env:REPO/actions/workflows/$env:WORKFLOW_ID/runs?per_page=100" --jq '.workflow_runs[]' |
            ForEach-Object { $_ | ConvertFrom-Json })

          $successRuns = @($runs | Where-Object conclusion -eq 'success' |
            Sort-Object -Property created_at -Descending)
          $successIdsToDelete = @($successRuns |
            Select-Object -Skip ([int]$env:KEEP_SUCCESS) | ForEach-Object id)

          $failedIdsToDelete = @()
          if ($successRuns.Count -gt 0) {
            $newestSuccessCreatedAt = $successRuns[0].created_at
            $failedConclusions = @('failure', 'cancelled', 'timed_out',
                                   'action_required', 'skipped')
            $failedIdsToDelete = @($runs | Where-Object {
                $_.conclusion -in $failedConclusions -and
                $_.created_at -lt $newestSuccessCreatedAt
              } | ForEach-Object id)
          }

          foreach ($id in ($successIdsToDelete + $failedIdsToDelete)) {
            Write-Output "Deleting run $id"
            gh api -X DELETE "repos/$env:REPO/actions/runs/$id"
          }
